<h2>Patient History</h2>

<table border="1">
<tr>
    <th>Date</th>
    <th>Result</th>
    <th>Confidence</th>
    <th>Steps</th>
    <th>Cadence</th>
    <th>Symmetry</th>
</tr>

{% for row in data %}
<tr>
    <td>{{ row[2] }}</td>
    <td>{{ row[3] }}</td>
    <td>{{ row[4] }}</td>
    <td>{{ row[5] }}</td>
    <td>{{ row[6] }}</td>
    <td>{{ row[7] }}</td>
</tr>
{% endfor %}

</table>
