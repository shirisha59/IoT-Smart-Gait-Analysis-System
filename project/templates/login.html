<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare Login</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        :root{
            --primary:#0f766e;
            --primary-dark:#0b5f59;
            --secondary:#14b8a6;
            --bg:#f4f8fb;
            --card:#ffffff;
            --text:#0f172a;
            --muted:#64748b;
            --border:#dbe4ee;
            --shadow:0 20px 45px rgba(15, 118, 110, 0.12);
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                radial-gradient(circle at top left, rgba(20,184,166,0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(15,118,110,0.10), transparent 25%),
                var(--bg);
            padding:20px;
            overflow:hidden;
        }

        .background-shape{
            position:absolute;
            width:500px;
            height:500px;
            border-radius:50%;
            background:rgba(20,184,166,0.06);
            top:-180px;
            right:-120px;
            z-index:0;
        }

        .background-shape-2{
            position:absolute;
            width:380px;
            height:380px;
            border-radius:50%;
            background:rgba(15,118,110,0.05);
            bottom:-150px;
            left:-100px;
            z-index:0;
        }

        .login-card{
            position:relative;
            z-index:2;
            width:100%;
            max-width:420px;
            background:var(--card);
            border:1px solid rgba(255,255,255,0.7);
            border-radius:28px;
            padding:42px;
            box-shadow:var(--shadow);
            backdrop-filter:blur(10px);
        }

        .logo{
            width:64px;
            height:64px;
            border-radius:18px;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 24px;
            box-shadow:0 10px 25px rgba(15,118,110,0.25);
        }

        .logo svg{
            width:30px;
            height:30px;
            fill:white;
        }

        .title{
            text-align:center;
            font-size:28px;
            font-weight:700;
            color:var(--text);
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:var(--muted);
            font-size:14px;
            margin-bottom:32px;
            line-height:1.5;
        }

        .input-group{
            margin-bottom:18px;
        }

        .input-label{
            display:block;
            font-size:14px;
            font-weight:600;
            color:#334155;
            margin-bottom:8px;
        }

        .input-field{
            width:100%;
            padding:14px 16px;
            border-radius:14px;
            border:1px solid var(--border);
            background:#fbfdff;
            font-size:15px;
            transition:all 0.25s ease;
        }

        .input-field:focus{
            outline:none;
            border-color:var(--secondary);
            background:white;
            box-shadow:0 0 0 4px rgba(20,184,166,0.12);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:24px;
            font-size:13px;
        }

        .remember{
            display:flex;
            align-items:center;
            gap:8px;
            color:var(--muted);
        }

        .forgot{
            color:var(--primary);
            text-decoration:none;
            font-weight:600;
        }

        .forgot:hover{
            text-decoration:underline;
        }

        .login-btn{
            width:100%;
            border:none;
            padding:15px;
            border-radius:16px;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.25s ease;
            box-shadow:0 12px 24px rgba(15,118,110,0.22);
        }

        .login-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 16px 30px rgba(15,118,110,0.28);
        }

        .login-btn:active{
            transform:scale(0.98);
        }

        .footer{
            margin-top:28px;
            text-align:center;
            color:var(--muted);
            font-size:14px;
        }

        .footer a{
            color:var(--primary);
            text-decoration:none;
            font-weight:600;
        }

        .footer a:hover{
            text-decoration:underline;
        }

        @media(max-width:480px){

            .login-card{
                padding:32px 24px;
                border-radius:24px;
            }

            .title{
                font-size:24px;
            }
        }
    </style>
</head>

<body>

    <div class="background-shape"></div>
    <div class="background-shape-2"></div>

    <div class="login-card">

        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M19 14a7 7 0 1 0-7 7v-3h-2v-2h2v-2h2v2h2v2h-2v3a7 7 0 0 0 5-7z"/>
            </svg>
        </div>

        <h1 class="title">Welcome Back</h1>

        <p class="subtitle">
            Securely access your healthcare dashboard and manage your wellness journey.
        </p>

        <form method="post">

            <div class="input-group">
                <label class="input-label">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    class="input-field"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="input-group">
                <label class="input-label">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    class="input-field"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <div class="options">

                <label class="remember">
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#" class="forgot">Forgot Password?</a>

            </div>

            <button type="submit" class="login-btn">
                Sign In
            </button>

        </form>

        <div class="footer">
            Don’t have an account?
            <a href="/signup">Create Account</a>
        </div>

    </div>

</body>
</html>
