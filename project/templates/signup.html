<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthcare Signup</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        html{
            scroll-behavior:smooth;
        }

        :root{
            --primary:#0f766e;
            --primary-dark:#0b5f59;
            --secondary:#14b8a6;
            --bg:#f4f8fb;
            --card:#ffffff;
            --text:#0f172a;
            --muted:#64748b;
            --border:#dbe4ee;
            --shadow:0 20px 45px rgba(15,118,110,0.12);
        }

        body{
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:
                radial-gradient(circle at top left, rgba(20,184,166,0.12), transparent 28%),
                radial-gradient(circle at bottom right, rgba(15,118,110,0.10), transparent 25%),
                var(--bg);
            padding:30px 20px;
            overflow-x:hidden;
            overflow-y:auto;
        }

        .background-shape{
            position:fixed;
            width:500px;
            height:500px;
            border-radius:50%;
            background:rgba(20,184,166,0.06);
            top:-180px;
            right:-120px;
            z-index:0;
        }

        .background-shape-2{
            position:fixed;
            width:380px;
            height:380px;
            border-radius:50%;
            background:rgba(15,118,110,0.05);
            bottom:-150px;
            left:-100px;
            z-index:0;
        }

        .signup-card{
            position:relative;
            z-index:2;
            width:100%;
            max-width:460px;
            background:rgba(255,255,255,0.92);
            border:1px solid rgba(255,255,255,0.7);
            border-radius:30px;
            padding:42px;
            box-shadow:var(--shadow);
            backdrop-filter:blur(12px);
        }

        .logo{
            width:68px;
            height:68px;
            border-radius:20px;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            display:flex;
            align-items:center;
            justify-content:center;
            margin:0 auto 24px;
            box-shadow:0 12px 28px rgba(15,118,110,0.25);
        }

        .logo svg{
            width:32px;
            height:32px;
            fill:white;
        }

        .title{
            text-align:center;
            font-size:30px;
            font-weight:800;
            color:var(--text);
            margin-bottom:10px;
            letter-spacing:-1px;
        }

        .subtitle{
            text-align:center;
            color:var(--muted);
            font-size:15px;
            margin-bottom:34px;
            line-height:1.7;
        }

        .input-group{
            margin-bottom:20px;
        }

        .input-label{
            display:block;
            font-size:14px;
            font-weight:600;
            color:#334155;
            margin-bottom:8px;
        }

        .input-field{
            width:100%;
            padding:15px 16px;
            border-radius:16px;
            border:1px solid var(--border);
            background:#fbfdff;
            font-size:15px;
            transition:all 0.25s ease;
        }

        .input-field:focus{
            outline:none;
            border-color:var(--secondary);
            background:white;
            box-shadow:0 0 0 4px rgba(20,184,166,0.12);
        }

        select{
            appearance:none;
            cursor:pointer;
        }

        .role-wrapper{
            position:relative;
        }

        .role-wrapper::after{
            content:"⌄";
            position:absolute;
            right:18px;
            top:50%;
            transform:translateY(-50%);
            color:var(--muted);
            font-size:18px;
            pointer-events:none;
        }

        .terms{
            display:flex;
            align-items:flex-start;
            gap:10px;
            margin-bottom:26px;
            font-size:13px;
            color:var(--muted);
            line-height:1.6;
        }

        .terms input{
            margin-top:4px;
            accent-color:var(--primary);
        }

        .terms a{
            color:var(--primary);
            text-decoration:none;
            font-weight:600;
        }

        .terms a:hover{
            text-decoration:underline;
        }

        .signup-btn{
            width:100%;
            border:none;
            padding:16px;
            border-radius:18px;
            background:linear-gradient(135deg,var(--primary),var(--secondary));
            color:white;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:all 0.25s ease;
            box-shadow:0 12px 24px rgba(15,118,110,0.22);
        }

        .signup-btn:hover{
            transform:translateY(-2px);
            box-shadow:0 16px 30px rgba(15,118,110,0.28);
        }

        .signup-btn:active{
            transform:scale(0.98);
        }

        .divider{
            display:flex;
            align-items:center;
            gap:14px;
            margin:28px 0;
            color:#94a3b8;
            font-size:13px;
        }

        .divider::before,
        .divider::after{
            content:"";
            flex:1;
            height:1px;
            background:#e2e8f0;
        }

        .social-login{
            display:flex;
            gap:14px;
        }

        .social-btn{
            flex:1;
            padding:14px;
            border-radius:16px;
            border:1px solid var(--border);
            background:white;
            font-weight:600;
            cursor:pointer;
            transition:0.25s ease;
        }

        .social-btn:hover{
            border-color:var(--secondary);
            transform:translateY(-2px);
        }

        .footer{
            margin-top:30px;
            text-align:center;
            color:var(--muted);
            font-size:14px;
        }

        .footer a{
            color:var(--primary);
            text-decoration:none;
            font-weight:700;
        }

        .footer a:hover{
            text-decoration:underline;
        }

        @media(max-width:480px){

            body{
                padding:20px 14px;
                align-items:flex-start;
            }

            .signup-card{
                padding:32px 22px;
                border-radius:24px;
                margin-top:20px;
                margin-bottom:20px;
            }

            .title{
                font-size:24px;
            }

            .subtitle{
                font-size:14px;
            }

            .social-login{
                flex-direction:column;
            }
        }

    </style>
</head>

<body>

    <div class="background-shape"></div>
    <div class="background-shape-2"></div>

    <div class="signup-card">

        <div class="logo">

            <svg viewBox="0 0 24 24">
                <path d="M19 14a7 7 0 1 0-7 7v-3h-2v-2h2v-2h2v2h2v2h-2v3a7 7 0 0 0 5-7z"/>
            </svg>

        </div>

        <h1 class="title">
            Create Your Account
        </h1>

        <p class="subtitle">
            Join our secure healthcare platform to manage appointments,
            doctors, records, and your complete wellness journey.
        </p>

        <form method="post">

            <div class="input-group">

                <label class="input-label">
                    Username
                </label>

                <input 
                    type="text"
                    name="username"
                    class="input-field"
                    placeholder="Enter your username"
                    required
                >

            </div>

            <div class="input-group">

                <label class="input-label">
                    Password
                </label>

                <input 
                    type="password"
                    name="password"
                    class="input-field"
                    placeholder="Create a secure password"
                    required
                >

            </div>

            <div class="input-group">

                <label class="input-label">
                    Select Role
                </label>

                <div class="role-wrapper">

                    <select name="role" class="input-field">

                        <option value="patient">
                            Patient
                        </option>

                        <option value="doctor">
                            Doctor
                        </option>

                    </select>

                </div>

            </div>

            <label class="terms">

                <input type="checkbox" required>

                <span>
                    I agree to the 
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>
                </span>

            </label>

            <button type="submit" class="signup-btn">
                Create Account
            </button>

        </form>

        <div class="divider">
            or continue with
        </div>

        <div class="social-login">

            <button class="social-btn">
                Google
            </button>

            <button class="social-btn">
                Apple
            </button>

        </div>

        <div class="footer">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </div>

    </div>

</body>
</html>
